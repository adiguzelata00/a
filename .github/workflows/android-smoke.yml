name: Android smoke test

# Builds the release APK and starts it on an emulator: catches crashes at
# launch (e.g. native plugin setup) that unit tests can not see.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release --dart-define=ADMOB_TEST_ADS=true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./tool/ci/android_smoke.sh

      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-smoke
          path: |
            logcat.txt
            crash.txt
            smoke.png
          if-no-files-found: ignore
