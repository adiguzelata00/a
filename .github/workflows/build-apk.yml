# Builds the Android APK on GitHub's servers, so no local Flutter or
# Android Studio install is needed to try the game on a phone.
# Download it from the run's "Artifacts" section (tengri-taslari-apk).
name: Build APK

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned so the runner image (and its Android SDK) only changes on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze

      - name: Test
        run: flutter test

      # Without android/key.properties the release build is signed with the
      # debug key: installable for testing, not for Google Play.
      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v5
        with:
          name: tengri-taslari-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
